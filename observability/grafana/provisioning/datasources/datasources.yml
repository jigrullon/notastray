apiVersion: 1

datasources:
  - uid: loki
    name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 1000

  # JSON API datasource (community plugin, installed via GF_INSTALL_PLUGINS
  # in docker-compose.yml) pointed at this app's own internal metrics
  # endpoints — the business/marketing dashboard's data source. Values are
  # expanded from the Grafana container's own environment (set in
  # observability/.env, see .env.example) — never hardcoded here.
  - uid: infinity
    name: Infinity (NotAStray Metrics)
    type: yesoreyeram-infinity-datasource
    access: proxy
    jsonData:
      httpHeaderName1: 'X-Internal-Metrics-Key'
    secureJsonData:
      httpHeaderValue1: '${INTERNAL_METRICS_API_KEY}'
